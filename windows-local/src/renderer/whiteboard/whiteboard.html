<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'self' data:">
<link rel="stylesheet" href="../shared/doodle.css">
<link rel="stylesheet" href="../../../node_modules/katex/dist/katex.min.css">
<link rel="stylesheet" href="../../../node_modules/@highlightjs/cdn-assets/styles/github-dark.min.css">
<style>
  html, body { margin: 0; height: 100%; background: #1f3b2d; color: #f4f1e8; font: 21px/1.45 var(--font-body); }
  body { border: 10px solid #8a5a2b; box-sizing: border-box; }
  header { -webkit-app-region: drag; display: flex; align-items: center; justify-content: space-between; padding: 4px 12px; background: #8a5a2b; font: 700 26px var(--font-title); color: #fff7e0; }
  header button { -webkit-app-region: no-drag; background: #fff7e0; color: #1f2a44; border: 2px solid #1f2a44; border-radius: var(--wobbly-radius); padding: 2px 12px; font: 18px var(--font-body); margin-left: 6px; cursor: pointer; }
  header button:hover { background: #fff176; transform: rotate(-2deg); }
  #board { height: calc(100% - 52px); overflow-y: auto; padding: 14px 20px 60px; box-sizing: border-box; }
  .line { margin: 10px 0; opacity: 0; transform: translateY(6px); animation: appear .45s forwards; }
  @keyframes appear { to { opacity: 1; transform: none; } }
  .heading { font: 700 34px var(--font-title); color: #ffe98a; margin-top: 18px; }
  .math { font-size: 21px; overflow-x: auto; padding: 4px 0; }
  pre { margin: 0; border-radius: 8px; overflow-x: auto; font-size: 14.5px; }
  pre code.hljs { border-radius: 8px; padding: 12px 14px; }
  .diagram svg { max-width: 100%; height: auto; background: #fff; border-radius: 8px; padding: 8px; box-sizing: border-box; }
  .error { color: #ff9b9b; font-size: 14px; }
  .snapshot { margin: 6px 4px 14px; background: #fff7e0; padding: 10px 10px 4px; transform: rotate(-1.2deg); box-shadow: 4px 5px 0 rgba(0,0,0,.35); position: relative; }
  .snapshot::before { content: ''; position: absolute; top: -12px; left: 50%; width: 90px; height: 24px; margin-left: -45px; background: rgba(255,233,138,.85); transform: rotate(3deg); }
  .snapshot img { display: block; width: 100%; height: auto; border: 2px solid #1f2a44; }
  .snapshot figcaption { font: 700 24px var(--font-title); color: #1f2a44; text-align: center; padding: 4px 0 2px; }
  .term-word { font: 700 26px var(--font-title); color: #1f2a44; background: #fff176; padding: 0 8px; border-radius: 4px; margin-right: 6px; display: inline-block; transform: rotate(-1deg); }
</style>
</head>
<body>
<header><span>the whiteboard</span><span><button id="clear">clear</button><button id="close">hide</button></span></header>
<div id="board"></div>
<script src="../../../node_modules/katex/dist/katex.min.js"></script>
<script src="../../../node_modules/@highlightjs/cdn-assets/highlight.min.js"></script>
<script src="../../../node_modules/mermaid/dist/mermaid.min.js"></script>
<script src="whiteboard.js"></script>
</body>
</html>
